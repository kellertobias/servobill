name: Semantic Release

# Runs on GitHub only (Forgejo reads .forgejo/workflows, where the full
# checks run on every pull request). No tests here: the code on main has
# already passed them on Forgejo. This workflow only creates the release
# and builds the Docker images for it.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # semantic-release needs all tags and commits

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # Only the release tooling, not the whole app
      - name: Install semantic-release plugins
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          semantic_version: 22

  images:
    name: Docker images
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/weekly-docker-build.yml
    with:
      tag: v${{ needs.release.outputs.version }}
    secrets: inherit
