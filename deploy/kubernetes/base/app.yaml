# Web app: UI + API (replaces CloudFront, API Gateway and the API Lambdas).
# Stateless; scale with replicas. Files must live in S3/MinIO (or a
# ReadWriteMany volume) when running more than one replica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: servobill-app
  labels:
    app.kubernetes.io/name: servobill-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: servobill-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: servobill-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: servobill-app
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: servobill-config
            - secretRef:
                name: servobill-secrets
          env:
            - name: ENDPOINT_EVENTBRIDGE
              value: http://servobill-workers:9326
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
---
apiVersion: v1
kind: Service
metadata:
  name: servobill-app
spec:
  selector:
    app.kubernetes.io/name: servobill-app
  ports:
    - name: http
      port: 80
      targetPort: http
