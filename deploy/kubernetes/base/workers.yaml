# Workers: event bus, event handlers, PDF rendering, cron
# (replaces EventBridge, the event handler Lambdas and the scheduled cron).
# The event queue is a SQLite file, so this runs as a single replica with a
# ReadWriteOnce volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: servobill-workers-queue
spec:
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: servobill-workers
  labels:
    app.kubernetes.io/name: servobill-workers
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: servobill-workers
  template:
    metadata:
      labels:
        app.kubernetes.io/name: servobill-workers
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workers
          image: servobill-workers
          ports:
            - name: http
              containerPort: 9326
          envFrom:
            - configMapRef:
                name: servobill-config
            - secretRef:
                name: servobill-secrets
          env:
            - name: ENDPOINT_EVENTBRIDGE
              value: http://servobill-workers:9326
            - name: EVENT_QUEUE_DB
              value: /queue/event-queue.db
          volumeMounts:
            - name: queue
              mountPath: /queue
            # Chromium needs a writable /tmp and a larger /dev/shm
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
      volumes:
        - name: queue
          persistentVolumeClaim:
            claimName: servobill-workers-queue
        - name: tmp
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: servobill-workers
spec:
  selector:
    app.kubernetes.io/name: servobill-workers
  ports:
    - name: http
      port: 9326
      targetPort: http
