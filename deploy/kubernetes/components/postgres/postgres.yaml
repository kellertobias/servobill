apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: servobill-postgres
  labels:
    app.kubernetes.io/name: servobill-postgres
spec:
  serviceName: servobill-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: servobill-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: servobill-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: servobill
            - name: POSTGRES_DB
              value: servobill
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: servobill-secrets
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ['pg_isready', '-U', 'servobill', '-d', 'servobill']
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: servobill-postgres
spec:
  selector:
    app.kubernetes.io/name: servobill-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
