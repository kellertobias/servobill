# Example installation: copy this folder, adjust config.env, create
# secrets.env from secrets.env.example and run:
#
#   kubectl apply -k deploy/kubernetes/overlays/example
#
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: servobill

resources:
  - namespace.yaml
  - ../../base

components:
  # Remove these when you use an external Postgres / S3 compatible storage
  - ../../components/postgres
  - ../../components/s3
  # Nightly database + file backups, see docs/backup.md
  - ../../components/backup

configMapGenerator:
  - name: servobill-config
    envs:
      - config.env

secretGenerator:
  - name: servobill-secrets
    envs:
      - secrets.env

# Pin the image version (the base and components default to v1)
images:
  - name: ghcr.io/kellertobias/servobill/app
    newTag: v1
  - name: ghcr.io/kellertobias/servobill/workers
    newTag: v1
  - name: ghcr.io/kellertobias/servobill/backup
    newTag: v1

patches:
  - target:
      kind: Ingress
      name: servobill-app
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: billing.example.com
      - op: add
        path: /spec/tls
        value:
          - hosts: [billing.example.com]
            secretName: servobill-tls
  - target:
      kind: Ingress
      name: servobill-s3
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: s3.billing.example.com
      - op: add
        path: /spec/tls
        value:
          - hosts: [s3.billing.example.com]
            secretName: servobill-s3-tls
