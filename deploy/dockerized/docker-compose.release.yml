# Servobill - self-hosted deployment with pre-built images.
#
#   cp env.example .env   # and adjust it
#   docker compose -f docker-compose.release.yml up -d
#
# Services replace the AWS parts of the serverless deployment:
#   app      -> CloudFront, API Gateway, API Lambdas
#   workers  -> EventBridge, event handler Lambdas, scheduled cron, PDF rendering
#   postgres -> DynamoDB
#   /data    -> S3 (or set UPLOAD_DIRECTORY= and ENDPOINT_S3=... for S3/MinIO)
#   SMTP     -> SES (configure SMTP_* in .env)
#   backup   -> DynamoDB point-in-time recovery / S3 versioning (docs/backup.md)

x-servobill-env: &servobill-env
  POSTGRES_URL: postgres://servobill-user:${DB_PASSWORD:?set DB_PASSWORD in .env}@postgres:5432/servobill-db
  UPLOAD_DIRECTORY: ${UPLOAD_DIRECTORY-/data/files}
  ENDPOINT_EVENTBRIDGE: http://workers:9326

services:
  postgres:
    image: postgres:15
    container_name: servobill-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: servobill-user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: servobill-db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U servobill-user -d servobill-db']
      interval: 10s
      timeout: 5s
      retries: 10

  workers:
    image: ${SERVOBILL_IMAGE_PREFIX:-ghcr.io/kellertobias/servobill}/workers:${SERVOBILL_VERSION:-v1}
    container_name: servobill-workers
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *servobill-env
      PORT: '9326'
    volumes:
      - ${DATA_VOLUME:-servobill-data}:/data
    depends_on:
      postgres:
        condition: service_healthy

  app:
    image: ${SERVOBILL_IMAGE_PREFIX:-ghcr.io/kellertobias/servobill}/app:${SERVOBILL_VERSION:-v1}
    container_name: servobill-app
    restart: unless-stopped
    # Authentication (LOCAL_AUTH_*, INITIAL_ADMIN_*, OIDC_*, ...), SMTP and
    # everything else comes from .env, see env.example and docs/authentication.md
    env_file: .env
    environment:
      <<: *servobill-env
      PORT: '3000'
    ports:
      - '${HTTP_PORT:-3000}:3000'
    volumes:
      - ${DATA_VOLUME:-servobill-data}:/data
    depends_on:
      postgres:
        condition: service_healthy
      workers:
        condition: service_started

  # Daily database dump + file archive with retention and optional offsite
  # copy. See docs/backup.md for configuration and restoring.
  backup:
    image: ${SERVOBILL_IMAGE_PREFIX:-ghcr.io/kellertobias/servobill}/backup:${SERVOBILL_VERSION:-v1}
    container_name: servobill-backup
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *servobill-env
      TZ: ${TZ:-UTC}
    volumes:
      - ${DATA_VOLUME:-servobill-data}:/data
      - ${BACKUP_VOLUME:-servobill-backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data: {}
  servobill-data: {}
  servobill-backups: {}
